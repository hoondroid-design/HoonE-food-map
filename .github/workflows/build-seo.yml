name: Build SEO pages

on:
  schedule:
    - cron: "7 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-seo
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate pages from Google Sheet
        run: node scripts/build-seo.mjs

      - name: Commit if changed
        run: |
          git config user.name "seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto update $(TZ=Asia/Seoul date +%F)"
            git push
          fi
